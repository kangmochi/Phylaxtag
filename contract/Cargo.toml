[package]
name = "phylaxtag"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.95"
description = "Phylaxtag warranty NFT contract for NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"
near-contract-standards = "=5.30.0"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = true
